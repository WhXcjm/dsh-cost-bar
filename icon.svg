<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cost meter">
  <!-- white tile with a hairline edge so it reads on white cards too -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>

  <!-- banknote outline -->
  <rect x="10.5" y="20.5" width="43" height="25" rx="5" fill="none" stroke="#4D6BFE" stroke-width="2.6"/>

  <!-- CNY mark -->
  <g fill="none" stroke="#4D6BFE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 26.2 L32 32.6 L38 26.2"/>
    <path d="M32 32.6 L32 40.6"/>
    <path d="M27 34.6 L37 34.6"/>
    <path d="M27 38.9 L37 38.9"/>
  </g>
</svg>
